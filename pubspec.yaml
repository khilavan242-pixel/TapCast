name: tapcast
description: Cast YouTube and files from your phone to a DLNA TV. Share a video and it plays on the TV.
publish_to: "none"
version: 0.3.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
